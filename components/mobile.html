<div class="mobile-only">
  <div class="hero-mobile" id="heroMobile">
    <video autoplay muted loop playsinline src="public/video/hero.MP4"></video>
    <div class="hero-mobile-top">
      <button class="glass circle" aria-label="Меню" onclick="openSideMenu()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <line x1="3" y1="6" x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
      <button class="glass circle" onclick="openCart()" aria-label="Корзина">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="21" r="1"/>
          <circle cx="20" cy="21" r="1"/>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="identity-mobile">
    <div class="rest-name">Эль <span class="accent">Крыша</span></div>
    <div class="rest-tagline">Авторская кухня с доставкой</div>
    <div class="open-pill" id="mobileStatusPill" onclick="openSchedule('delivery')">
      <span class="status-dot"></span>
      <span id="mobileStatusText">Проверка времени...</span>
    </div>
    <div style="margin-top: 16px; padding: 0 20px;">
      <button class="glass pill primary" style="width: 100%; height: 54px; font-size: 16px;" onclick="openLogin()" id="mobileLoginBtn">
        Войти
      </button>
    </div>
  </div>

  <div class="stories-mobile-wrap">
    <h2 class="section-title">Афиша <span class="muted">событий</span></h2>
    <div class="stories-grid-mobile" id="storiesGridMobile"></div>
  </div>

  <div class="cat-scroll" id="catScroll"></div>
  <div class="menu-list-mobile" id="mobileMenuList"></div>

  <div class="footer-mobile">
    <div class="logo" style="justify-content:center;margin-bottom:16px;">
      <div class="logo-text">
        <span class="main">Эль Крыша</span>
        <span class="sub">Ресторан & Доставка</span>
      </div>
    </div>
    <div>+7 (985) 481-84-34</div>
    <div>ул. Центральный б-р. д. 4, 6 этаж · 12:00–00:00</div>
    <div style="margin-top:16px;opacity:0.5;">© 2026 Эль Крыша</div>
  </div>

  <div class="mobile-bottom-bar">
    <button class="mobile-cart-btn" onclick="openCart()">
      🛒 Корзина
      <span class="cart-badge" id="cartBadgeMobile">0</span>
      <span id="mobileCartTotal" style="margin-left:auto;font-weight:700;"></span>
    </button>
  </div>
</div>
