<div class="story-viewer" id="storyViewer" onclick="if(event.target === this) closeStory()">
  <div class="story-viewer-inner" id="storyViewerInner">
    <div class="story-progress" id="storyProgress"></div>
    <button class="story-close" onclick="closeStory()" aria-label="Закрыть">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
    <button class="story-nav prev" onclick="prevSlide()" aria-label="Назад">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
    </button>
    <button class="story-nav next" onclick="nextSlide()" aria-label="Вперёд">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 18 15 12 9 6"></polyline>
      </svg>
    </button>

    <div class="story-slides" id="storySlides"></div>
    <div class="story-overlay"></div>

    <div class="story-info" id="storyInfo">
      <div class="tag" id="storyTag"></div>
      <h3 id="storyTitle"></h3>
      <p id="storyDesc"></p>
      <div class="meta">
        <span id="storyDateMeta">📅 <span id="storyDateText"></span></span>
        <span id="storyTimeMeta">🕐 <span id="storyTimeText"></span></span>
      </div>
      <button class="story-book-btn" id="storyBookBtn">
        Забронировать на эту дату
      </button>
    </div>
  </div>
</div>
