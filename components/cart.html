<div class="cart-overlay" id="cartOverlay" onclick="closeCart()"></div>
<div class="cart-drawer" id="cartDrawer">
  <div class="cart-header">
    <h2>Корзина</h2>
    <button class="glass circle" style="width:40px;height:40px;border-radius:20px;" onclick="closeCart()" aria-label="Закрыть">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </div>
  <div class="cart-items" id="cartItems"></div>
  <div class="cart-footer">
    <div class="cart-row"><span>Доставка</span><span id="deliveryCost">0 ₽</span></div>
    <div class="cart-row total"><span>Итого</span><span id="cartTotal">0 ₽</span></div>
    <button class="checkout-btn" id="checkoutBtn" onclick="checkout()" disabled>Оформить заказ</button>
  </div>
</div>
