<div class="dish-modal-overlay" id="dishModalOverlay" onclick="if(event.target === this) closeDishModal()">
  <div class="dish-modal" id="dishModalContent">
    <button class="close-btn" onclick="closeDishModal()" aria-label="Закрыть">✕</button>
    
    <!-- Скроллируемая часть -->
    <div class="dish-modal-scroll">
      <div class="dish-modal-img"><img id="dmImg" src="" alt=""></div>
      <div class="dish-modal-content">
        <div class="dish-modal-header">
          <div>
            <div class="dish-modal-title" id="dmTitle"></div>
            <div class="dish-modal-weight" id="dmWeight"></div>
          </div>
          <div class="dish-modal-price" id="dmPrice"></div>
        </div>
        <div class="dish-modal-desc" id="dmDesc"></div>
        <div class="dish-modal-compound" id="dmCompound"></div>
        
        <div class="kbju-block">
          <div class="kbju-header">
            <div class="kbju-toggle">
              <button class="active" onclick="toggleKbju('portion', this)">На порцию</button>
              <button onclick="toggleKbju('100g', this)">На 100 г</button>
            </div>
          </div>
          <div class="kbju-grid">
            <div class="kbju-item"><div class="val" id="kbjuCal">0</div><div class="lbl">Ккал</div></div>
            <div class="kbju-item"><div class="val" id="kbjuProt">0</div><div class="lbl">Белки</div></div>
            <div class="kbju-item"><div class="val" id="kbjuFat">0</div><div class="lbl">Жиры</div></div>
            <div class="kbju-item"><div class="val" id="kbjuCarb">0</div><div class="lbl">Углеводы</div></div>
          </div>
        </div>

        <div class="addons-section">
          <h4>Добавить к блюду</h4>
          <div id="dmAddons"></div>
        </div>
      </div>
    </div>

    <!-- Футер с кнопкой (прижат к низу) -->
    <div class="dish-modal-footer">
      <div class="qty-selector">
        <button onclick="changeModalQty(-1)">−</button>
        <span id="dmQty">1</span>
        <button onclick="changeModalQty(1)">+</button>
      </div>
      <button class="glass pill primary" onclick="addFromModal()">Добавить в корзину</button>
    </div>
  </div>
</div>
